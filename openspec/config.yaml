schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish
context: |
  Specs document existing behavior of the four-package Bun workspace
  (core, opencode, opencode-v2, pi); requirement changes must keep the
  OpenCode 1 and OpenCode 2 adapters on identical Antigravity wire invariants
  (VALIDATED toolConfig, trailing user turn, function-call signature policy).
  OpenCode 2 is the 0.0.0-beta-* line of @opencode-ai/plugin and
  @opencode-ai/cli (promise-plugin API); OpenCode 1 is the 1.x line.
  Never run OpenCode 2 tests or probes unless OPENCODE_DB points to an
  isolated temporary database. Pool storage (antigravity-accounts.json, v4)
  is shared across adapters and must stay fail-closed under the fenced file
  lock.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
